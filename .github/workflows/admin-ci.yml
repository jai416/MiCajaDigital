name: CI Panel Admin

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'config/**'
      - 'lib/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'middleware.ts'
      - 'next.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'tsconfig.json'
      - 'tailwind.config.js'
      - '.env.example'
      - '.github/workflows/admin-ci.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'config/**'
      - 'lib/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'middleware.ts'
      - 'next.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'tsconfig.json'
      - 'tailwind.config.js'
      - '.env.example'
      - '.github/workflows/admin-ci.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint -- --max-warnings=0 || true
        # `next lint` está deprecado en Next 14 y el `|| true` lo hace
        # decorativo: no puede poner el CI en rojo. Mientras siga así, el lint
        # se ejecuta como AVISO y quien quiera vigilarlo debe mirar el log.

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          # Build sin secretos reales: el fail-fast de supabase.ts solo aplica
          # en runtime de producción, no en compile-time.

  e2e:
    runs-on: ubuntu-latest
    needs: build
    # El e2e es lento (Chromium ~200 MB). Solo en main y en PR de rama real,
    # no en cada push de documentación.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    env:
      # OJO: 127.0.0.1:9 (puerto "discard", cerrado) en vez de un dominio tipo
      # placeholder.supabase.co. El dominio placeholder sí resuelve (Supabase
      # tiene DNS wildcard) y el cliente se queda esperando TLS/conexión: el
      # POST /api/login tardaba más que los 15 s del test y 'Credenciales
      # incorrectas' nunca llegaba a tiempo. Con un puerto cerrado el fallo es
      # instantáneo (ECONNREFUSED) y el rate-limit cae al contador en memoria
      # (NODE_ENV=development), que es justo lo que se quiere testear.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:9
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: placeholder-password-solo-e2e
      ADMIN_SESSION_SECRET: placeholder-session-secret-solo-e2e-0000000000000000
      ADMIN_SESSION_VERSION: v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: "Instalar Playwright (no está en package.json; se activa solo aquí)"
        run: npm install --no-save @playwright/test@^1.49.0

      - name: "Instalar navegador (cacheado: ~3 min la 1ª vez, ~10 s después)"
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Instalar Chromium si falta en la cache
        run: npx playwright install --with-deps chromium

      - name: Tests e2e (sin credenciales reales)
        run: npx playwright test
