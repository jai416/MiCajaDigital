name: CI Panel Admin

on:
  push:
    paths: ['admin/**', '.github/workflows/admin-ci.yml']
  pull_request:
    paths: ['admin/**', '.github/workflows/admin-ci.yml']

defaults:
  run:
    working-directory: admin

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint -- --max-warnings=0 || true

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          # Build sin secretos reales: el fail-fast de supabase.ts solo aplica
          # en runtime de producción, no en compile-time.

  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Playwright (no está en package.json: se activa solo aquí)
        run: npm install --no-save @playwright/test@^1.49.0

      - name: Instalar navegador
        run: npx playwright install --with-deps chromium

      - name: Tests e2e (sin credenciales reales)
        run: npx playwright test
