name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Free disk space
        run: |
          sudo apt clean
          docker system prune -f
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android/sdk/ndk-bundle
          sudo rm -rf /usr/local/lib/android/sdk/build-tools/29.0.2
          sudo rm -rf /usr/local/lib/android/sdk/build-tools/29.0.3
          sudo rm -rf /usr/local/lib/android/sdk/build-tools/30.0.2
          sudo rm -rf /usr/local/lib/android/sdk/build-tools/30.0.3
          df -h
          
      - uses: actions/checkout@v5   # ✅ Actualizado a v5 (Node.js 24)

      - name: Setup Node.js
        uses: actions/setup-node@v6   # ✅ Actualizado a v6 (Node.js 24)
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Expo CLI
        run: npm install -g expo-cli eas-cli

      - name: Prebuild Android
        run: npx expo prebuild --platform android

      - name: Build APK
        run: cd android && ./gradlew assembleDebug --no-daemon --refresh-dependencies

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk
